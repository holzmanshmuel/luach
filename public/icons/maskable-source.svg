    <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <rect x="112" y="150" width="288" height="240" rx="28"/>
      <line x1="112" y1="212" x2="400" y2="212"/>
      <line x1="176" y1="122" x2="176" y2="170"/>
      <line x1="336" y1="122" x2="336" y2="170"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="168" cy="260" r="10"/>
      <circle cx="234" cy="260" r="10"/>
      <circle cx="300" cy="260" r="10"/>
      <circle cx="168" cy="316" r="10"/>
      <circle cx="234" cy="316" r="10"/>
    </g>
    <circle cx="300" cy="316" r="20" fill="#BEF264"/>
  </g>
</svg>
